[project]
name = "ai-trainer"
version = "1.0.0"
description = "Hebrew WhatsApp health coach for Home Assistant"
requires-python = ">=3.12"
license = { text = "MIT" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["custom_components/ai_trainer"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]
